<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Students — Proton Hub Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/admin/css/admin-base.css">
  <link rel="stylesheet" href="/admin/css/admin-components.css">
  <link rel="stylesheet" href="/admin/css/admin-pages.css">

  <!-- PWA Setup -->
  <link rel="manifest" href="/admin/manifest.json">
  <meta name="theme-color" content="#002855">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Proton Hub Admin">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/admin/sw.js').catch(() => { });
      });
    }
  </script>
</head>

<body>
  <div class="app-layout">
    <div class="main-content" id="mainContent">
      <div class="page-content">
        <!-- Fee Overview Cards -->
        <div class="fee-overview" id="feeOverview">
          <div class="fee-overview-grid">
            <div class="fee-stat-card total">
              <div class="fee-stat-icon"><i class="fas fa-users"></i></div>
              <div class="fee-stat-info">
                <div class="fee-stat-label">Total Students</div>
                <div class="fee-stat-value" id="feeStatTotal">—</div>
              </div>
            </div>
            <div class="fee-stat-card collected">
              <div class="fee-stat-icon"><i class="fas fa-check-circle"></i></div>
              <div class="fee-stat-info">
                <div class="fee-stat-label">Fully Paid</div>
                <div class="fee-stat-value" id="feeStatPaid">—</div>
                <div class="fee-stat-amount" id="feeStatPaidAmt"></div>
              </div>
            </div>
            <div class="fee-stat-card pending">
              <div class="fee-stat-icon"><i class="fas fa-clock"></i></div>
              <div class="fee-stat-info">
                <div class="fee-stat-label">Pending</div>
                <div class="fee-stat-value" id="feeStatPending">—</div>
                <div class="fee-stat-amount" id="feeStatPendingAmt"></div>
              </div>
            </div>
            <div class="fee-stat-card partial">
              <div class="fee-stat-icon"><i class="fas fa-exclamation-circle"></i></div>
              <div class="fee-stat-info">
                <div class="fee-stat-label">Partial</div>
                <div class="fee-stat-value" id="feeStatPartial">—</div>
                <div class="fee-stat-amount" id="feeStatPartialAmt"></div>
              </div>
            </div>
          </div>
          <div class="fee-progress-bar" id="feeProgressContainer">
            <div class="fee-progress-fill paid" id="feeProgressPaid"></div>
            <div class="fee-progress-fill partial-fill" id="feeProgressPartial"></div>
          </div>
          <div class="fee-progress-legend">
            <span class="legend-item"><span class="legend-dot paid"></span> Collected</span>
            <span class="legend-item"><span class="legend-dot partial-dot"></span> Partial</span>
            <span class="legend-item"><span class="legend-dot pending-dot"></span> Pending</span>
            <span class="legend-amount" id="feeCollectedTotal"></span>
          </div>
        </div>

        <!-- Toolbar -->
        <div class="toolbar">
          <div class="toolbar-left">
            <div class="search-box">
              <i class="fas fa-search"></i>
              <input type="text" id="searchInput" placeholder="Search by name or class...">
            </div>
            <select class="filter-select" id="filterSession">
              <option value="" selected>All Sessions</option>
              <option value="2025-26">2025-26</option>
              <option value="2026-27">2026-27</option>
              <option value="2027-28">2027-28</option>
            </select>
            <select class="filter-select" id="filterClass">
              <option value="">All Classes</option>
              <option value="Class 1">Class 1</option>
              <option value="Class 2">Class 2</option>
              <option value="Class 3">Class 3</option>
              <option value="Class 4">Class 4</option>
              <option value="Class 5">Class 5</option>
              <option value="Class 6">Class 6</option>
              <option value="Class 7">Class 7</option>
              <option value="Class 8">Class 8</option>
              <option value="Class 9">Class 9</option>
              <option value="Class 10">Class 10</option>
              <option value="Class 11">Class 11</option>
              <option value="Class 12">Class 12</option>
            </select>
            <select class="filter-select" id="filterFee">
              <option value="">All Fee Status</option>
              <option value="paid">Paid</option>
              <option value="pending">Pending</option>
              <option value="partial">Partial</option>
            </select>
          </div>
          <div class="toolbar-right">
            <button class="btn btn-secondary btn-sm" id="viewAllPaymentsBtn"><i class="fas fa-list"></i> All Payments</button>
            <button class="btn btn-secondary btn-sm" id="exportCsvBtn"><i class="fas fa-download"></i> Export
              CSV</button>
            <button class="btn btn-primary" id="addStudentBtn"><i class="fas fa-user-plus"></i> Add Student</button>
          </div>
        </div>

        <!-- Table -->
        <div class="table-wrapper">
          <table class="data-table" id="studentsTable">
            <thead>
              <tr>
                <th>Name</th>
                <th>Class</th>
                <th>Phone</th>
                <th>Parent Name</th>
                <th>Total Fee</th>
                <th>Pending</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="studentsBody">
              <tr>
                <td colspan="9">
                  <div class="empty-state"><i class="fas fa-spinner fa-spin"></i>
                    <p>Loading students...</p>
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
          <div id="paginationContainer"></div>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="/admin/js/students.js"></script>
</body>

</html>
